# Local Security Camera Monitor — streaming engine config (go2rtc)
#
# Cameras you add from the dashboard are written into the "streams:" section
# below automatically. You can also add them by hand (see examples).
#
# NOTE: go2rtc rewrites this file when you add a camera from the dashboard,
# so hand-written comments below the header may be removed over time.
# Full documentation lives in README.md next to this file.

api:
  listen: "127.0.0.1:1984"   # Laptop-only (secure default). See README to open it to your WiFi.
  static_dir: "www"          # Serve the custom dashboard from the www/ folder (same origin, no CORS).

webrtc:
  listen: ":8555"            # Low-latency WebRTC path. Fine to leave as-is.

log:
  level: info

# Your cameras go here as  name: source-url
# Manual examples (remove the leading '#', edit IP/user/pass, and restart):
#
# streams:
#   front_door: rtsp://user:pass@192.168.1.20:554/h264Preview_01_main      # Reolink
#   driveway:   rtsp://user:pass@192.168.1.21:554/Streaming/Channels/101   # Hikvision / Annke
#   garden:     rtsp://user:pass@192.168.1.22:554/cam/realmonitor?channel=1&subtype=0  # Dahua / Amcrest
#   garage:     onvif://user:pass@192.168.1.23:80                          # any ONVIF camera
streams: {}
